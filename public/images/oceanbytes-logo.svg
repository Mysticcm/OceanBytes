<svg width="180" height="48" viewBox="0 0 180 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OceanBytes logo</title>
  <desc id="desc">Logo med bølgeikon og teksten OceanBytes</desc>

  <!-- Farger -->
  <!-- blueDeepSpace: #153243 -->
  <!-- lightYellow:   #FDFCDC -->

  <!-- Bølge-ikon -->
  <g transform="translate(0, 4)">
    <circle cx="20" cy="20" r="18" fill="#153243" />
    <path
      d="M10 22
         C 13 18, 17 18, 20 20
         C 23 22, 27 22, 30 20
         C 27 24, 23 26, 20 26
         C 17 26, 13 24, 10 22 Z"
      fill="#FDFCDC"
    />
    <path
      d="M12 18
         C 15 15, 18 15, 21 17
         C 24 19, 27 19, 30 17"
      fill="none"
      stroke="#FDFCDC"
      stroke-width="2"
      stroke-linecap="round"
    />
  </g>

  <!-- Tekst OceanBytes -->
  <g transform="translate(48, 28)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">
    <text x="0" y="0" fill="#FDFCDC">Ocean</text>
    <text x="64" y="0" fill="#153243">Bytes</text>
  </g>
</svg>
